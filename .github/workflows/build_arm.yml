name: Build ARM

on:
  pull_request:
  push:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  # ---------------------------------------
  # Unit testing with Ceedling
  # ---------------------------------------
  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: '2.7.8'

    - name: Checkout TinyUSB
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Unit Tests
      run: |
        # This legacy test configuration targets Ceedling 0.31 / Ruby 2.7.
        gem install ceedling --version 0.31.1 --no-document
        cd test
        ceedling test:all

  # ---------------------------------------
  # Build ARM family
  # ---------------------------------------
  build-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family:
        # Alphabetical order
        - 'imxrt'
        - 'lpc15'
        - 'lpc18'
        - 'lpc54'
        - 'lpc55'
        - 'mm32'
        - 'msp432e4'
        - 'nrf'
        - 'rp2040'
        - 'samd11'
        - 'samd21'
        - 'samd51'
        - 'saml2x'
        - 'stm32f0'
        - 'stm32f1'
        - 'stm32f4'
        - 'stm32f7'
        - 'stm32h7'
        - 'stm32l4'
        - 'tm4c123'
        - 'xmc4000'
    steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Checkout TinyUSB
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Checkout common submodules in lib
      run: git submodule update --init lib/FreeRTOS-Kernel lib/lwip lib/sct_neopixel

    - name: Checkout hathach/linkermap
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: hathach/linkermap
        ref: 8e1f440fa15c567aceb5aa0d14f6d18c329cc67f
        path: linkermap
        persist-credentials: false

    - name: Checkout pico-sdk
      if: matrix.family == 'rp2040'
      run: |
        git clone --depth 1 --branch 1.3.0 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
        test "$(git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD)" = ea79d29cd6e5f124b964b01b76b28846c017e205
        echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

    - name: Set Toolchain URL
      run: echo "TOOLCHAIN_URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v10.2.1-1.1/xpack-arm-none-eabi-gcc-10.2.1-1.1-linux-x64.tar.gz" >> "$GITHUB_ENV"

    - name: Cache Toolchain
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache-toolchain
      with:
        path: ~/cache/
        key: ${{ runner.os }}-21-03-04-${{ env.TOOLCHAIN_URL }}

    - name: Install Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/cache/toolchain
        wget --timeout=30 --tries=3 --progress=dot:mega "$TOOLCHAIN_URL" -O toolchain.tar.gz
        tar -C ~/cache/toolchain -xaf toolchain.tar.gz

    - name: Set Toolchain Path
      run: |
        for tool_bin in ~/cache/toolchain/*/bin; do
          test -d "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
        done

    - name: Build
      run: python3 -u tools/build_family.py ${{ matrix.family }}

    - name: Linker Map
      run: |
        python -m pip install ./linkermap
        found=0
        for ex in examples/device/*/ examples/host/*/; do
          map=$(find "$ex" -name '*.map' -print -quit)
          if [ -n "$map" ]; then
            found=1
            echo "::group::$map"
            linkermap -v "$map"
            echo "::endgroup::"
          fi
        done
        test "$found" -eq 1

  # ---------------------------------------
  # Build all no-family (opharned) boards
  # ---------------------------------------
  build-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example:
        # Alphabetical order, a group of 4
        - 'device/audio_test device/board_test device/cdc_dual_ports device/cdc_msc'
        - 'device/cdc_msc_freertos device/dfu_runtime device/hid_composite device/hid_composite_freertos'
        - 'device/hid_generic_inout device/hid_multiple_interface device/midi_test device/msc_dual_lun'
        - 'device/net_lwip_webserver'
        - 'device/uac2_headset device/usbtmc device/webusb_serial host/cdc_msc_hid'

    steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Checkout TinyUSB
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Checkout common submodules in lib
      run: git submodule update --init lib/FreeRTOS-Kernel lib/lwip

    - name: Set Toolchain URL
      run: echo "TOOLCHAIN_URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v10.2.1-1.1/xpack-arm-none-eabi-gcc-10.2.1-1.1-linux-x64.tar.gz" >> "$GITHUB_ENV"

    - name: Cache Toolchain
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache-toolchain
      with:
        path: ~/cache/
        key: ${{ runner.os }}-21-03-04-${{ env.TOOLCHAIN_URL }}

    - name: Install Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/cache/toolchain
        wget --timeout=30 --tries=3 --progress=dot:mega "$TOOLCHAIN_URL" -O toolchain.tar.gz
        tar -C ~/cache/toolchain -xaf toolchain.tar.gz

    - name: Set Toolchain Path
      run: |
        for tool_bin in ~/cache/toolchain/*/bin; do
          test -d "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
        done

    - name: Build
      run: python3 -u tools/build_board.py ${{ matrix.example }}
