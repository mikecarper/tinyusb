name: Build Renesas

on:
  pull_request:
  push:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build-rx:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family:
        # Alphabetical order
        - 'rx'
    steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Checkout TinyUSB
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Checkout common submodules in lib
      run: git submodule update --init lib/FreeRTOS-Kernel lib/lwip

    - name: Checkout hathach/linkermap
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: hathach/linkermap
        ref: 8e1f440fa15c567aceb5aa0d14f6d18c329cc67f
        path: linkermap
        persist-credentials: false

    - name: Set Toolchain URL
      # Public package used by upstream TinyUSB; the old vendor URL is stale.
      run: echo "TOOLCHAIN_URL=https://github.com/hathach/rx_device/releases/download/0.0.1/gcc-8.3.0.202411-GNURX-ELF.run" >> "$GITHUB_ENV"

    - name: Cache Toolchain
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache-toolchain
      with:
        path: ~/cache/
        key: ${{ runner.os }}-21-03-30-${{ env.TOOLCHAIN_URL }}

    - name: Install Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/cache/toolchain/gnurx
        wget --timeout=30 --tries=3 --progress=dot:mega "$TOOLCHAIN_URL" -O toolchain.run
        chmod +x toolchain.run
        ./toolchain.run -p ~/cache/toolchain/gnurx -y

    - name: Set Toolchain Path
      run: |
        for tool_bin in ~/cache/toolchain/*/bin; do
          test -d "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
        done

    - name: Build
      run: python3 -u tools/build_family.py ${{ matrix.family }}

    - name: Linker Map
      run: |
        python -m pip install ./linkermap
        found=0
        for ex in examples/device/*/ examples/host/*/; do
          map=$(find "$ex" -name '*.map' -print -quit)
          if [ -n "$map" ]; then
            found=1
            echo "::group::$map"
            linkermap -v "$map"
            echo "::endgroup::"
          fi
        done
        test "$found" -eq 1
