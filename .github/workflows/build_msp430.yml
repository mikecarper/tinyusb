name: Build MSP430

on:
  pull_request:
  push:
  release:
    types:
      - created

permissions:
  contents: read

jobs:  
  build-msp430:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family:
        # Alphabetical order
        - 'msp430'
    steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Checkout TinyUSB
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Checkout common submodules in lib
      run: git submodule update --init lib/FreeRTOS-Kernel lib/lwip

    - name: Checkout hathach/linkermap
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: hathach/linkermap
        ref: 8e1f440fa15c567aceb5aa0d14f6d18c329cc67f
        path: linkermap
        persist-credentials: false

    - name: Set Toolchain URL
      run: echo "TOOLCHAIN_URL=https://software-dl.ti.com/msp430/msp430_public_sw/mcu/msp430/MSPGCC/9_2_0_0/export/msp430-gcc-9.2.0.50_linux64.tar.bz2" >> "$GITHUB_ENV"

    - name: Cache Toolchain
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache-toolchain
      with:
        path: ~/cache/
        key: ${{ runner.os }}-21-03-04-${{ env.TOOLCHAIN_URL }}

    - name: Install Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/cache/toolchain
        wget --timeout=30 --tries=3 --progress=dot:mega "$TOOLCHAIN_URL" -O toolchain.tar.bz2
        tar -C ~/cache/toolchain -xaf toolchain.tar.bz2

    - name: Set Toolchain Path
      run: |
        for tool_bin in ~/cache/toolchain/*/bin; do
          test -d "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
        done

    - name: Build
      run: python3 -u tools/build_family.py ${{ matrix.family }}

    - name: Linker Map
      run: |
        python -m pip install ./linkermap
        found=0
        for ex in examples/device/*/ examples/host/*/; do
          map=$(find "$ex" -name '*.map' -print -quit)
          if [ -n "$map" ]; then
            found=1
            echo "::group::$map"
            linkermap -v "$map"
            echo "::endgroup::"
          fi
        done
        test "$found" -eq 1
